<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; connect-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'" />
    <title>scrim — 영상·사진 얼굴 비식별화</title>
    <meta name="description" content="브라우저 안에서만 동작하는 영상·사진 얼굴 비식별화 도구. 업로드 없음, 서버 없음 — 파일은 기기를 떠나지 않습니다." />
    <meta name="theme-color" content="#f4f4f2" />
    <!-- 파비콘. 브라우저가 암묵적으로 찾는 /favicon.ico는 **오리진 루트**로
         요청되는데 이 앱은 서브패스(/scrim/)에 배포되므로 404가 난다 —
         .ico를 명시 선언해야 탭 아이콘이 잡힌다.
         **래스터만 선언한다.** Safari(WebKit)는 rel=icon의 SVG를 렌더링하지
         못하는데, 아이콘이 여럿이면 마지막 선언을 고르는 브라우저가 있어
         SVG를 같이 두면 Safari 탭이 빈 채로 남는다. 실제로 그렇게 나왔다.
         아이콘 원본은 icon.svg이며 래스터는 scripts/gen-icons.py로 생성한다. -->
    <link rel="icon" href="/favicon.ico?v=__BUILD_ID__" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=__BUILD_ID__" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=__BUILD_ID__" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=__BUILD_ID__" />
    <!-- iPad 홈 화면 추가용 (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest?v=__BUILD_ID__" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=__BUILD_ID__" />
    <meta name="apple-mobile-web-app-title" content="scrim" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
