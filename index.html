<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; connect-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'" />
    <title>scrim — 영상·사진 얼굴 비식별화</title>
    <meta name="description" content="브라우저 안에서만 동작하는 영상·사진 얼굴 비식별화 도구. 업로드 없음, 서버 없음 — 파일은 기기를 떠나지 않습니다." />
    <meta name="theme-color" content="#f4f4f2" />
    <!-- 파비콘. 서브패스(/scrim/) 배포라 .ico를 명시 선언해야 한다 — 브라우저가
         암묵적으로 찾는 /favicon.ico는 오리진 루트로 요청되어 404다.
         Safari 탭 아이콘이 계속 비어서 관례적인 최소 형태만 남긴다:
          - SVG(rel=icon)는 WebKit이 렌더링하지 못하므로 선언하지 않는다
          - 링크가 여럿이면 마지막을 고르는 구현이 있어 개수를 줄인다
          - 버전 쿼리(?v=)를 붙이지 않는다. 파비콘 요청은 페이지 fetch와
            경로가 달라(브라우저 프로세스가 직접 받는다) 쿼리가 붙은 URL에서
            문제가 보고된 적이 있고, 어차피 Safari는 파비콘을 자체 DB에
            오래 캐시해 ?v=로는 갱신되지 않는다.
            → 아이콘 그림이 바뀌면 파일명을 바꿔 캐시를 무효화할 것.
         원본은 icon.svg이며 래스터는 `pnpm gen:icons`로 생성한다. -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- iPad 홈 화면 추가용 (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest?v=__BUILD_ID__" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="scrim" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
